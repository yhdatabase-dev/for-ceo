# CI 게이트 — push/PR 마다 백엔드 pytest + 프론트 tsc·빌드·E2E 스모크.
# 이 게이트를 통과하지 못한 코드는 배포(Vercel 자동빌드·fly deploy) 전에 걸러진다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend — pytest (판정 골든 테스트 80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7" # 운영 Dockerfile(python:3.14.7-slim)과 일치
          cache: pip
          cache-dependency-path: backend/requirements-api.txt
      - name: 의존성 설치
        run: |
          pip install -r backend/requirements-api.txt -r backend/requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q
        # conftest 가 CGR_DATA_DIR 임시화·캐시 비활성·더미 키를 설정 — 외부 호출 0

  frontend:
    name: frontend — tsc · build · Playwright 스모크
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0   # 운영 Dockerfile(node:24.21.0-alpine)과 일치
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 프로덕션 빌드
        run: npm run build
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: E2E 스모크 (검토 결과 화면 렌더)
        run: npx playwright test
        # CI 에서는 위에서 빌드한 산출물을 next start 로 띄워 테스트 (playwright.config.ts)
      - name: 실패 시 트레이스 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
