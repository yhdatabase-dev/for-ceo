# Fly.io 배포 설정 — 취업규칙 검토 AI 백엔드
#
# 도쿄(nrt) 리전: 한국에서 가장 가까운 Fly 리전 (ping ~30ms).
# auto_stop = false + min_machines_running = 1 → 콜드 스타트 없음 (항상 가동).
#
# 최초 배포:
#   fly launch --no-deploy      # 앱 생성 (이 toml 사용)
#   fly secrets set OPENAI_API_KEY=sk-... CGR_API_KEY=... CGR_DB_HOST=... (CGR_DB_* 5개)
#   fly deploy
#
# 이후 배포: fly deploy

app = "cgr-backend"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CGR_ENVIRONMENT = "prod"
  # 로컬 기본값(config.DEFAULT_LLM_MODEL)과 반드시 일치 — 모델이 다르면 답변·거부
  # 동작이 달라진다. gpt-4o-mini 는 정당한 질문도 과하게 거부함.
  CGR_LLM_MODEL = "gpt-5.4-mini"
  # 가변 데이터(통계 events.db·업로드 파일·편집형 프롬프트)는 영구 볼륨(/data)에 둠
  # → 배포 시 초기화 방지. master.db(참조)는 이미지 번들 유지.
  CGR_DATA_DIR = "/data"

# 영구 볼륨 — 배포 전 1회 생성 필요:
#   fly volumes create cgr_data --region nrt --size 1
[mounts]
  source = "cgr_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # 항상 1대 유지 — 콜드 스타트 제거 (영세사업장 사용자 응답성 우선)
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

# 헬스체크 — /api/cgr/warmup (인증 불필요, 즉시 200)
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/cgr/warmup"

[[vm]]
  # 분석 LLM 대기 중 메모리 여유 — 1GB. 부족하면 2048 로 상향.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
